[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — 24/7 crypto market-research and signal system. Analyzes only; a human trades."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sentinel owner" }]

# Heavier libraries from ARCHITECTURE.md §2 are added in the milestone that needs
# them, per CLAUDE.md's >1MB approval rule. All of §2's list has now landed.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  # M1 — ingestion (owner-approved 2026-08-18)
  "ccxt>=4.4",
  "pandas>=2.2",
  "feedparser>=6.0",
  # DECLARED 2026-08-21 (M10b-1), found by `make check-deps` on its very first run —
  # two more of the same defect httpx was. Both are imported DIRECTLY by our own code
  # (`sentinel/features/indicators.py` does `import numpy as np`, `sentinel/bot/pulse.py`
  # does `from annotated_types import MaxLen`) and both were arriving transitively, the
  # first through pandas/matplotlib and the second through pydantic. Neither is a new
  # dependency — nothing new is installed by declaring them — but each was one upstream
  # reorganisation away from being the next httpx.
  #
  # `annotated-types` stays `>=`: it is a handful of dataclasses with no numerical
  # behaviour, and there is nothing about it a version could change silently.
  "annotated-types>=0.7",
  #
  # `numpy` PINNED EXACTLY 2026-08-21 (M10c, owner ruling). journal/M10b_REPORT.md §3a
  # left this open; it is settled here for the same reason matplotlib and mplfinance are
  # pinned two lines down. numpy sits underneath both of those AND underneath every RSI,
  # ATR and EMA value the feature engine computes, so an upstream change moves stored
  # chart bytes and stored indicator values with no error anywhere — the failure mode
  # this repository's goldens exist to catch and a floating dependency exists to hide.
  #
  # 2.2.6 is the version EVERY committed golden was produced under, which is the only
  # evidence available. There is no live-cycle evidence for a numpy the way there was
  # for `anthropic==0.125.0`, because nothing logs it.
  #
  # M10c FINDING — the pin CHANGES the image, and that is the point. Before it, a
  # freshly built image resolved **numpy 2.5.2** while `.venv` resolved **2.2.6**, so
  # the suite has never once validated the numpy the container runs. The cause is that
  # `pandas-ta` (a test-only oracle) pulls `numba`, which refuses NumPy above 2.2 — a
  # DEV-extra constraint silently holding the whole test environment two minor versions
  # behind production. Exactly the shape of M10b-1 §3's three-versions-of-anthropic
  # defect, and structurally invisible for the same reason: every check runs where the
  # constraint applies.
  #
  # Verified before pinning, so this is a measurement and not a hope: the golden, chart
  # and feature suites were run in a scratch venv at numpy 2.5.2 and **every golden was
  # byte-identical**. The only failure was `pandas-ta` itself, which cannot import. So
  # the two versions agree today, and the pin makes .venv, the image and the goldens
  # name one number instead of three.
  "numpy==2.2.6",
  # DECLARED 2026-08-21 (M10b-1), and it should have been from M1. Six modules
  # `import httpx` directly — ingestion/http.py, llm/client.py, core/wiring.py and
  # three tools — and it was in no dependency list at all. It arrived transitively
  # through `anthropic`, so everything worked until `anthropic` 1.0.0 moved to
  # `httpx2`; a freshly resolved image then had no httpx and the app died at boot on
  # `import sentinel.main`. `make check-image` caught it, which is exactly why
  # journal/M7_REPORT.md §6 added the in-image import to the gate — the wheel built
  # cleanly, so the wheel check alone was never going to.
  #
  # It stays declared even though the pinned anthropic below brings it transitively.
  # An undeclared direct dependency is a latent break whichever way the transitive
  # chain happens to move next (owner ruling 2026-08-21).
  #
  # PINNED EXACTLY to the version production is running, verified on the server.
  # `make check-deps` enforces the declaration; nothing enforces the version but this.
  "httpx==0.28.1",
  # M3 — chart renderer (owner-approved 2026-08-18).
  # PINNED EXACTLY, not >=: charts must be byte-reproducible for any stored
  # signal, and a rasterisation change in a future matplotlib would break that
  # silently — no error, just different pixels. Bump these deliberately and
  # regenerate the golden hashes in tests/charts/ when you do.
  "mplfinance==0.12.10b0",
  "matplotlib==3.11.1",
  # M5 — LLM pipeline (owner-approved 2026-08-18). The Messages API client for
  # both tiers: screener (claude-sonnet-4-6) and analyst (claude-fable-5).
  # Read-only inference; no exchange credentials pass through it, ever.
  #
  # PINNED EXACTLY 2026-08-21 (owner ruling), to the version production is running.
  # Same convention as matplotlib/mplfinance below, and for a stronger reason: this
  # was `>=0.122`, so the server ran 0.125.0, the test venv ran 0.122.0 and a fresh
  # image resolved **1.0.0** — a major bump, on the one dependency that talks to the
  # model, arriving as a silent side effect of the next deploy.
  #
  # 0.125.0 has 37 completed live cycles behind it. That is stronger evidence than
  # any test suite, and it is the only version with evidence at all. Moving to 1.0.0
  # is its own milestone with its own testing, not something that happens to a live
  # measurement window while nobody is looking.
  "anthropic==0.125.0",
  # M6 — Telegram bot (ARCHITECTURE.md §2 names it; pyproject reserved it for this
  # milestone). Read-only towards the exchange by construction: the bot talks to
  # api.telegram.org and to our own Postgres, and there is no execution path for it
  # to reach (PRD §3). Brings no new transport — aiohttp is already here via ccxt.
  "aiogram>=3.15,<4",
  # M8.6 — /journal's XLSX export (owner-approved 2026-08-20). 250KB wheel,
  # ~1.3MB unpacked plus et-xmlfile; pure Python with no native extension, so it
  # cannot break the image build the way a compiled wheel could.
  #
  # It accepts a Decimal without a cast at the call site (its NUMERIC_TYPES
  # includes Decimal); XlsxWriter's write_number takes a float outright. Neither
  # can store one exactly — XLSX numbers are IEEE doubles, so Decimal ends at the
  # file boundary whatever writes it. sentinel/bot/export.py documents exactly what
  # that costs, and tests that every figure round-trips through the file unchanged.
  #
  # Never used through pandas: DataFrame.to_excel puts a Decimal column through a
  # numpy dtype first. sentinel/bot/export.py writes cells directly.
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  # httpx is a RUNTIME dependency (see above), pinned there. It was listed here as
  # well, which is how six direct imports went undeclared for nine milestones without
  # anybody noticing: it was always installed, just never for the right reason.
  "mypy>=1.13",
  "ruff>=0.8",
  # M4 — property tests for the risk engine, required by name in
  # specs/RISK_ENGINE.md §8.2. ~0.5MB, under CLAUDE.md's 1MB approval bar.
  "hypothesis>=6.100",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
  # M2: third-party oracle for the indicator tests only (owner-approved
  # 2026-08-18). Not a runtime dependency — see journal/M2_REPORT.md §4 for why
  # the indicators are implemented directly instead.
  "pandas-ta>=0.4.71b0",
]

[tool.hatch.build.targets.wheel]
# Prompt text is data, not code, and it must ship in the wheel so `load_prompt`
# resolves inside the container as well as in a source checkout (CLAUDE.md
# §Prompts). `packages` already does that: hatchling ships every file under
# sentinel/, .md included — verified by inspecting the built wheel.
#
# There used to be a `force-include` here re-adding sentinel/analyst/prompts on
# top of that. It was redundant, and from M5 it broke `docker build` outright:
# hatchling refuses to add the same archive path twice, and the directory's
# .gitkeep (there since M0) was the collision. The image could not be rebuilt
# from M5 until M6.2 — which is why nothing catches it but a real build.
packages = ["sentinel"]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["sentinel", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # import sorting
  "UP",    # pyupgrade
  "B",     # bugbear
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "SIM",   # simplify
  "DTZ",   # naive-datetime guard — enforces the "UTC everywhere" rule
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["apscheduler.*", "ccxt.*", "feedparser.*", "mplfinance.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "allow_socket: opt out of the no-network guard (local Postgres round-trip tests only)",
]

[tool.coverage.run]
branch = true
source = ["sentinel"]

[tool.coverage.report]
# The risk engine is the one module the specs require at 100% branch coverage
# (MILESTONES M4, ARCHITECTURE §2). `make coverage-risk` enforces it.
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
