# Sentinel — non-secret runtime configuration.
#
# Precedence (ARCHITECTURE.md §2): DB overrides (set via Telegram) > this file > code defaults.
# Secrets NEVER live here — they come from .env / environment only.
# Every value below is transcribed from the specs; see the reference next to each block.

# M10a — one block per market. Everything in here used to be a single global
# value, and every one of them is something two markets would disagree about.
#
# A config file with NO `markets:` block is still valid and is read as crypto-only,
# synthesised from the old top-level `dry_run` / `watchlist` /
# `watchlist_max_symbols` keys. That is not politeness to old files: it is the shape
# the server is running, because docs/DEPLOY.md §6/§13 edit the deployed config in
# place. A file may carry one shape or the other and NEVER both — a `markets:` block
# alongside a top-level `dry_run:` is refused at load, because two places to set the
# same flag is one place for it to be wrong, silently, in the direction that
# publishes real cards during a rehearsal.
#
# NOTHING about crypto changes here. Every value below is transcribed from the keys
# it replaced; tests/golden asserts the resulting output byte for byte.
markets:
  crypto:
    enabled: true
    # Turned OFF 2026-08-19 (owner instruction), after the M8.2 shakedown: the
    # pipeline ran end to end all day, the spend rails were verified live
    # ($0.24/cycle against $0.75 before), and the owner wants real cards. true = run
    # the full cycle and publish NOTHING: the would-be card is rendered by the same
    # renderer and logged verbatim, the signal is stored with dry_run=true, and the
    # tracker resolves it silently. /stats reports dry-run outcomes as their own
    # population, never merged into real or hypothetical.
    dry_run: false
    adapter: crypto_binance
    # 60, not 15 (M8.2, owner ruling 2026-08-19). The setup timeframe is 1h, so a
    # 15-minute scan asked the analyst about the same unclosed candle four times.
    scan_interval_minutes: 60
    # M8.3: every symbol here is screened every cycle and can buy a ~$0.28 analyst
    # call, so this is the single biggest lever on the bill. The cap binds
    # /watchlist add and members' /request equally.
    watchlist_max_symbols: 15
    # PRD.md §7 — configurable at runtime via /watchlist.
    watchlist:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
      - XRPUSDT
      - DOGEUSDT
      - AVAXUSDT
      - LINKUSDT
      - LTCUSDT
      - ADAUSDT
    # This market's own daily LLM ceiling, and the level at which it warns. 10.00 is
    # today's live `llm.daily_spend_limit_usd` carried across unchanged — M10a's
    # brief proposed 8.00, and tightening a live spend rail in the middle of the
    # measurement window is a behaviour change the milestone exists to avoid
    # (correction recorded 2026-08-20, journal/M10a_REPORT.md).
    # Written as `10` and `7`, NOT `10.00`. YAML parses `10.00` as the float 10.0,
    # which becomes Decimal("10.0") and renders on /status as "$10.0" where today's
    # card says "$10". Decimal equality would not have caught it — Decimal("10.0")
    # == Decimal("10") — but the /status golden did. A one-character difference on a
    # live card is exactly the change this milestone is forbidden to make.
    llm_daily_budget_usd: 10
    llm_daily_warn_usd: 7
    # FOREX.md §13 decision 6 / M10a open question R5, applied in M10b-2. The
    # sub-budgets sum to 14 under an 11 ceiling on purpose, so the markets compete
    # for the last dollar. That is right between two measured markets and wrong the
    # day an unmeasured one joins a measured one: a forex-heavy morning could take
    # the shared dollar while crypto's live measurement window is still running.
    # Only the UNSPENT part of this is held, so once crypto has spent 8 it reserves
    # nothing and forex sees the full ceiling again.
    # Written as `8`, not `8.00` — see the YAML-float note above.
    llm_reserved_floor_usd: 8

  # ═══ SWITCHED ON 2026-08-21 (M10d) — A TWO-WEEK OBSERVATION WINDOW ═══
  #
  # REVIEW 2026-09-04, one day after crypto's measurement review, so both are read
  # together. This is not a permanent configuration. See `llm_daily_budget_global_usd`
  # below for the revert values, and journal/M10d_REPORT.md for what was measured.
  #
  # `dry_run: false`, deliberately and against FOREX.md §11's "forex starts in
  # DRY_RUN". journal/M7_REPORT.md settled what dry_run actually does: it publishes
  # NOTHING. The card is rendered and logged and the owner never sees it. The goal of
  # this window is that he READS real forex cards and does not trade them — "not
  # trading" is his hand on the mouse, not a config flag — and a rehearsal that shows
  # him nothing rehearses nothing. Owner decision, 2026-08-21.
  #
  # Everything under `forex:` at the bottom of this file becomes reachable today.
  forex:
    enabled: true
    dry_run: false
    adapter: forex_saxo
    scan_interval_minutes: 60
    watchlist_max_symbols: 15
    watchlist:
      - EURUSD
      - GBPUSD
      - USDJPY
    # 16 and 12, up from 4 and 3, for the observation window.
    #
    # MEASURED, not estimated (journal/M10d_REPORT.md, join 4): one claude-fable-5
    # call on a real forex payload is $0.226104 cached / $0.281925 uncached, and a
    # cycle of three pairs pays one cache write and two reads = $0.734. Twelve
    # cycles inside `forex.scan_hours_utc` is ~$8.81 on a trading day.
    #
    # Note the sub-budget is NOT what binds: crypto's reserved floor caps forex at
    # `llm_daily_budget_global_usd - 8` = $12 whatever crypto spends. 16 sits above
    # that on purpose, preserving the design where sub-budgets sum past the ceiling so
    # the markets compete for the last dollar rather than reserving it.
    llm_daily_budget_usd: 16
    llm_daily_warn_usd: 12
    # Its own prompt file. FOREX.md §2.1 requires the prompt to STATE which inputs
    # this market does not have, because an absence a model is not told about reads
    # as a quiet market rather than as a missing input. Crypto keeps fable_v1 and is
    # not edited — the golden prompt pins its bytes.
    analyst_prompt_version: fable_forex_v1

# The ceiling above both sub-budgets. Reaching it stops new deep analysis in EVERY
# market; reaching a sub-budget stops only that one.
#
# 10 + 4 = 14 against a ceiling of 11, deliberately. Sub-budgets that summed to the
# ceiling would let a quiet market reserve money a busy one could have used, all day,
# every day. They compete instead.
#
# M10a left "does the measured market get a floor" open (R5). M10b-2 answers it: yes,
# `markets.crypto.llm_reserved_floor_usd: 8`. Competition is right between two
# measured markets and wrong when an unmeasured one joins a measured one. Only the
# unspent part of the floor is held, so the competition resumes the moment crypto has
# actually spent its 8 — the floor protects the measurement, not crypto's convenience.
# ═══ RAISED 2026-08-21 (M10d) FOR THE FOREX OBSERVATION WINDOW ═══
#
# 11 -> 20. REVIEW 2026-09-04. REVERT VALUES IF FOREX IS NOT CONTINUED:
#     llm_daily_budget_global_usd: 11
#     markets.forex.llm_daily_budget_usd: 4     (and llm_daily_warn_usd: 3)
#     llm.daily_spend_limit_usd: 10             (and daily_spend_warn_usd: 7)
# A spend rail raised for a rehearsal and never lowered is how the $73/day incident
# started, so the way back is written down beside the way forward.
#
# WHAT THIS BUYS. Forex's real ceiling is `this - markets.crypto.llm_reserved_floor_usd`,
# not its own sub-budget: `evaluate_market_spend` suspends it at
# `global_day >= global - max(0, 8 - crypto_spent)`, and substituting
# `global_day = crypto + forex` cancels crypto out. So 20 - 8 = $12 for forex, against
# a measured need of $8.81 (12 cycles x $0.734). At 11 it was $3 — three cycles of
# twenty-four, all of them 00:00-03:00 UTC because the window resets at midnight, i.e.
# the thin Tokyo session and then silence through London and New York.
#
# WHAT THIS COSTS, and it is a trade rather than a side effect: a runaway loop can now
# burn $20/day before anything stops it, against $11 before. This ceiling is the last
# thing standing between a bug and the bill — nothing else in the system counts calls —
# so the blast radius of a scan-loop bug, a retry storm or a watchlist that grows is
# almost doubled for the length of the window. That is the correct trade for two weeks
# with a human watching, and it must be an expiring one.
#
# WHY FOREX NEEDS SO MUCH FOR THREE SYMBOLS WHEN CRYPTO NEEDS $3.61 FOR TEN: crypto has
# M8.2's two cost controls and forex has neither. There is no forex screener, so every
# pair buys a full analyst call every cycle; and a re-analysis cooldown of one
# setup-timeframe candle saves nothing here, because forex's setup timeframe is 1h and
# the scan interval is 60 minutes, so the cooldown would expire exactly when the next
# scan fires. Both are recorded as open questions for the review rather than guessed at
# now (journal/M10d_REPORT.md).
llm_daily_budget_global_usd: 20

# PRD.md F1 (15 min cycle), ARCHITECTURE.md §3 (tracker every 60s).
schedule:
  # 60, not 15 (M8.2, owner ruling 2026-08-19). The setup timeframe is 1h, so a
  # 15-minute scan asked the analyst about the same unclosed candle four times and
  # paid ~$0.76 each time. The M8.2 diagnostic measured 2.63 analyst calls per cycle
  # — 252/day against M7's ~24/day budget — and the two most-flagged symbols were
  # re-analysed every cycle on a standing condition. This alone is a 4x reduction.
  scan_interval_minutes: 60
  # M8.2 — a symbol whose last deep analysis returned WATCHLIST or NO_SETUP stays
  # quiet for one setup-timeframe candle. On 2026-08-19 LINKUSDT was escalated in
  # 8 of 8 cycles and SOLUSDT in 6 of 8, on standing conditions, and 61% of all
  # escalations came back WATCHLIST. 0 disables the rail.
  reanalysis_cooldown_minutes: 60
  tracker_interval_seconds: 60
  heartbeat_interval_seconds: 60
  symbol_timeout_seconds: 20      # per-symbol snapshot timeout (ARCHITECTURE.md §3)

# specs/DATA_SOURCES.md §2.1 — tail lengths per timeframe, order book depth.
market_data:
  exchange: binance_usdm
  orderbook_depth: 50
  # §2.1 specifies 200/200/200/100. We request one extra bar per timeframe
  # because the last candle Binance returns is still in progress and the feature
  # engine drops it — without the +1, only 199 closed candles remain and EMA200
  # could never be computed (PRD F3). The spec's tail lengths are preserved as
  # *closed* candles, which is what the indicators actually consume.
  # The chart timeframes request 321 (= 320 closed) rather than 201. An EMA200
  # is first defined at candle 200, so a 200-closed-candle tail yields exactly
  # ONE valid EMA200 point — nothing to draw a line between, and M3 requires
  # EMA200 on the chart. 320 closed gives 121 valid points, enough to span the
  # 120-candle chart window. Still one API call per timeframe; the extra rows
  # dedupe away on upsert. 1d keeps its 100-closed tail (see features.ema200).
  timeframes:
    - { timeframe: 15m, candles: 321 }
    - { timeframe: 1h, candles: 321 }
    - { timeframe: 4h, candles: 321 }
    - { timeframe: 1d, candles: 101 }

# specs/DATA_SOURCES.md §2–§3 — client behaviour and endpoints. Keys stay in .env.
ingestion:
  request_timeout_seconds: 10
  max_retries: 2                  # §3: retry with backoff, max 2
  retry_backoff_seconds: 0.5
  open_interest_history_period: 1h
  open_interest_history_limit: 24 # "current + 24h series"
  long_short_period: 1h
  orderbook_depth: 50
  news:
    limit: 20
    important_only: true
    cryptopanic_base_url: https://cryptopanic.com/api/v1/posts/
    # §2.2 fallback, parsed with feedparser when CryptoPanic is down or unkeyed.
    rss_feeds:
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://cointelegraph.com/rss
  fear_greed_url: https://api.alternative.me/fng/
  coingecko_global_url: https://api.coingecko.com/api/v3/global
  # Frankfurter's documented host is now api.frankfurter.dev; api.frankfurter.app
  # 301-redirects here. ECB rates, no key (§2.4).
  frankfurter_url: https://api.frankfurter.dev/v1/latest

# specs/DATA_SOURCES.md §4 — staleness budget per field. Core field stale/missing → skip
# symbol; secondary field stale → snapshot DEGRADED. Never fabricate a value instead.
data_quality:
  max_age_seconds:
    ohlcv_multiplier: 2           # OHLCV: 2× its own timeframe
    funding: 900                  # 15m
    open_interest: 1800           # 30m
    long_short_ratio: 1800
    orderbook: 300
    fear_greed: 86400             # 24h
    btc_dominance: 86400
    news_window: 21600            # 6h news window
    eurusd: 3600                  # refetched hourly, last-known-good fallback

# M2 feature engine. PRD F3 names the indicators; the regime and S/R parameters
# below are owner-approved (2026-08-18) because no spec defines them.
features:
  rsi_period: 14
  atr_period: 14
  ema_periods: [20, 50, 200]
  relative_volume_lookback: 20
  drop_partial_candle: true       # indicators run on CLOSED candles only
  primary_timeframe: 1h           # setup TF (PRD §7)
  context_timeframe: 4h           # regime TF
  # Volatility regime: ATR% ranked against its own trailing distribution, so the
  # thresholds hold for BTC and a small-cap alt alike.
  volatility_lookback: 100
  volatility_min_observations: 20
  volatility_low_percentile: 33.0
  volatility_high_percentile: 67.0
  # Support/resistance: confirmed fractal pivots (k bars each side, no repaint)
  # clustered into bands of 0.5 × ATR(14).
  pivot_window: 3
  level_cluster_atr_multiple: 0.5
  max_levels_per_side: 3
  level_timeframes: [1h, 4h]

# M3 chart renderer. Sized for the analyst's vision input, not for a screen:
# 1600px long edge stays under claude-fable-5's 2576px high-resolution limit, so
# nothing is downscaled server-side (downscaling is what blurs axis numbers and
# level labels). ~1.6MP ≈ 2,130 visual tokens per chart, ~6.4k for the album.
charts:
  width_px: 1600
  height_px: 1000
  dpi: 100                        # figsize inches map 1:1 to pixels
  volume_panel_ratio: 0.22
  candle_window: 120              # legibility: 200 candles is ~7px each, 120 is ~12px
  ema_periods: [20, 50, 200]
  max_levels: 6
  timeframes: [15m, 1h, 4h]       # PRD F4 — the analyst's chart album
  output_dir: charts_out

# specs/RISK_ENGINE.md §1 — risk defaults. capital_eur is intentionally absent:
# it is required before the first signal and set by the owner via /capital.
risk:
  risk_per_trade_pct: 0.75        # allowed range 0.25–1.5
  risk_per_trade_min_pct: 0.25
  risk_per_trade_max_pct: 1.5
  max_open_risk_pct: 2.25         # = 3 trades worth
  max_leverage: 10
  margin_budget_pct: 10
  daily_loss_limit_pct: 3.0
  max_positions: 4
  min_rr_tp1: 1.5
  max_entry_distance_pct: 3.0     # §2 rule 2 — no chasing
  min_confidence: 60              # §2 rule 6 — below → WATCHLIST
  stop_atr_min_multiple: 0.6      # §2 rule 3
  stop_atr_max_multiple: 3.0      # §2 rule 4
  min_rung_notional_usdt: 20      # §4 min-notional floor
  liq_buffer_multiple: 2.0        # §4 liq_distance ≥ 2× stop distance
  signal_cooldown_hours: 4        # ARCHITECTURE.md §3 dedup guard
  max_signals_per_day: 5          # specs/TELEGRAM_UX.md §6 — anti-spam hard cap

# M7 outcome tracker (ARCHITECTURE.md §3 — "runs every 1 min on taken/active
# signals"). Fills and stop-outs are detected from 1m candle HIGH/LOW since the
# last tick rather than from a polled mark price: a 60s poll misses the wick that
# actually filled the rung or hit the stop, and that error is not symmetric — it
# under-reports stop-outs, which flatters the win rate. Candles also replay, so a
# detection bug is reproducible from stored OHLCV.
#
# Invalidation is the exception and reads CLOSED 1h candles, because
# specs/TELEGRAM_UX.md §4 words it as a close ("1h close 81.05 < 81.40") and
# specs/PROMPTS.md §2 rule e tells the analyst to treat wick-only breaches as
# noise. A tick is not an invalidation.
tracker:
  fill_timeframe: 1m
  fill_lookback_candles: 5        # ceiling on how far one tick may look back
  invalidation_timeframe: 1h

# specs/RISK_ENGINE.md §4.2 (correction 2026-08-18) — transaction costs.
#
# Binance USDⓈ-M VIP 0, verified against the published schedule on 2026-08-18:
# https://www.binance.com/en/fee/futureFee  → maker 0.0200%, taker 0.0500%.
# The BNB discount (-10%) and VIP tiers are deliberately NOT modelled: these are
# the worst-case rates actually paid today, and a cost estimate should never be
# optimistic. Entries are the maker leg (the ladder is limit orders); EVERY exit
# — stop, TP, trail, manual — is priced as taker (owner ruling 2026-08-18).
costs:
  maker_fee_pct: 0.02
  taker_fee_pct: 0.05
  # Binance settles most USDⓈ-M perps every 8h (00/08/16 UTC); some settle every
  # 4h, and a contract that hits its funding cap drops to 1h until rates settle.
  # ccxt's premiumIndex response carries `interval: null` (see
  # tests/cassettes/binance_funding_SOLUSDT.json), so the real per-symbol
  # interval is not available without a second API call. 8h is an ESTIMATE —
  # which is one more reason the funding figure is labelled as one.
  funding_interval_hours: 8
  # Funding is a cost for a long when the rate is positive and a CREDIT for a
  # short. The card always shows the real signed estimate; this switch decides
  # whether a credit is allowed to *improve* net RR and push a plan over
  # min_rr_tp1. false = max(0, funding) in the gate — funding is an estimate of
  # a frequently-flipping input and must never be the reason a trade approves.
  credit_favourable_funding: false

# specs/RISK_ENGINE.md §3 — ladder construction (deterministic, engine-owned).
ladder:
  single_entry_atr_threshold: 0.5 # zone width < 0.5×ATR(1h) → single entry
  weights_pct: [40, 35, 25]       # rung 1 (nearest price) → rung 3 (best price)

# specs/RISK_ENGINE.md §5 — targets & management plan.
management:
  tp1_close_pct: 40
  tp2_close_pct: 35
  tp3_trail_atr_multiple: 1.0
  entry_ttl_hours_intraday: 12
  entry_ttl_hours_swing: 36

# ARCHITECTURE.md §2 / specs/PROMPTS.md — model tiers. Prompt text itself lives only in
# sentinel/analyst/prompts/vN.md files (CLAUDE.md).
llm:
  screener_model: claude-sonnet-4-6
  # M8.2 — screener_v2 is stricter about standing conditions. screener_v1.md is kept
  # and this is the one-line rollback if v2 turns out to under-escalate.
  screener_prompt_version: screener_v2
  analyst_model: claude-fable-5
  analyst_effort: high            # output_config.effort; thinking is always on for fable-5
  max_json_retries: 1             # schema-invalid CONTENT: retry once, then discard + log

  # Transport failures (429/5xx/connection) are a separate budget from the
  # content retry above — CLAUDE.md mandates the first, PROMPTS §2 the second.
  max_transport_retries: 2
  screener_timeout_seconds: 60
  # specs/ENSEMBLE.md §3 budgets 90s per provider. Raised to 150s (owner ruling
  # 2026-08-18, recorded as a dated correction in ENSEMBLE.md §3): M5's live
  # analyst calls ran 47-85s, so 90s leaves almost no headroom, and M10 runs two
  # providers in parallel against the same budget.
  analyst_timeout_seconds: 150
  screener_max_tokens: 4096
  analyst_max_tokens: 16000
  screener_batch_size: 0          # 0 = one call for the whole watchlist
  history_verdicts: 3             # specs/PROMPTS.md §3 — last N verdicts per symbol

  # M7 spend guard (pulled forward from M8). Unattended scheduling is what makes
  # this urgent: a bug or a market event that makes every symbol look interesting
  # can spend real money overnight. Reaching the daily limit suspends NEW DEEP
  # ANALYSIS ONLY — the screener keeps triaging and the tracker keeps managing
  # open positions (it makes no LLM calls at all). It self-clears at 00:00 UTC
  # because it is recomputed from llm_calls each cycle, so there is no pause row
  # to get stuck and nothing to /resume.
  #
  # These gate cost_usd_estimate, which is an ESTIMATE and not billing truth.
  # Sizing: the screener alone is ~$0.023/cycle ≈ $2.2/day at 96 cycles, so $10
  # leaves ~$7.8 for deep analysis — about 24 analyst calls at M5's ~$0.32.
  # RAISED 2026-08-21 (M10d) with the ceiling above. REVIEW 2026-09-04; revert to
  # 10 and 7.
  #
  # `daily_spend_warn_usd` is the one that HAD to move, and it is easy to miss why:
  # `evaluate_market_spend` reads it as the GLOBAL warn level (sentinel/llm/spend.py),
  # so at 7 against a $20 ceiling it would send a Telegram spend notice every single
  # day — an ordinary day is now ~$12.42 (crypto $3.61 + forex $8.81). Alert fatigue
  # on the one channel that has to stay meaningful is how a real warning gets muted.
  # 16 leaves ~$3.6 of headroom over an ordinary day and $4 of notice before the ceiling.
  #
  # `daily_spend_limit_usd` is NOT the operative global limit — that is
  # `llm_daily_budget_global_usd` above, which `evaluate_market_spend` checks first.
  # This one is the pre-M10a single-market limit, the value a `markets:`-less config
  # synthesises `markets.crypto.llm_daily_budget_usd` from, and what deployment-wide
  # surfaces display. It moves to 20 so no surface prints "of $10" while the system
  # actually allows $20.
  daily_spend_limit_usd: 20
  daily_spend_warn_usd: 16

  # USD per 1M tokens. In no spec, so it lives here: a price change is a config
  # edit, not a code change. Token counts are the ground truth; money is an
  # estimate (hence cost_usd_estimate everywhere it is stored).
  pricing:
    claude-sonnet-4-6:
      input_per_mtok: 3
      output_per_mtok: 15
      cache_read_per_mtok: 0.3
      cache_write_per_mtok: 3.75
    claude-fable-5:
      input_per_mtok: 10
      output_per_mtok: 50
      cache_read_per_mtok: 1
      cache_write_per_mtok: 12.5

# ARCHITECTURE.md §2 and §6 — "Telegram admin alert after 3 consecutive cycle
# failures". The alert says how many cycles failed, when the run started and what
# the newest one said, and repeats every `consecutive_cycle_failures` further
# failures so a continuing outage does not go quiet after one message. One
# recovery notice is sent when a cycle finally succeeds.
#
# A cycle row is written RUNNING before the cycle starts, so a process killed
# mid-cycle leaves RUNNING behind for ever. A row still RUNNING after
# stale_cycle_multiplier x scan_interval_minutes is counted as a failure — it is
# the most serious kind, and nothing else would ever notice it.
alerts:
  consecutive_cycle_failures: 3
  # 1, not 2 (M8.2). This is measured in scan intervals, so widening the scan to 60
  # minutes silently moved "the process died" detection from 30 minutes to two hours.
  # One interval holds it near an hour; ops/healthcheck.sh covers process death from
  # the host every 15 minutes and alerts after ~45, independently of this.
  stale_cycle_multiplier: 1

# specs/TELEGRAM_UX.md — rendering/display only. Allowlist lives in .env.
telegram:
  owner_timezone: Europe/Vilnius  # display only — everything internal stays UTC
  digest_hour_local: 8
  quiet_mode_on_no_setup: true
  # §1: "Charts (1h + 4h PNGs) attached as an album above the card." The analyst
  # still receives all three timeframes (charts.timeframes above) — this is the
  # owner's view, and the 15m timing detail is already priced into the entry zone.
  card_chart_timeframes: [1h, 4h]
  poll_timeout_seconds: 30
  parse_mode: HTML

# M10b-1/M10b-2 — the forex market's own settings. UNREACHABLE while
# markets.forex.enabled is false, which is how this release ships: deploying M10b-2
# is a no-op for the running crypto system.
#
# M10b-2 wired a forex cycle that would read these (adapter registry, features,
# charts, analyst prompt) and stops at an analyst report — sizing, the gate, the card
# and the tracker are M10c. None of it is reachable while the market is disabled.
#
# A top-level block rather than fields on markets.forex, because everything here is
# something only ONE market has at all — a pip grace period, a rollover hour, a swap
# table, a spread threshold. On MarketConfig they would sit on crypto as dead keys
# inviting somebody to give them meaning.
forex:
  # LIVE only. SIM is deliberately absent: the spike found SIM's spread is a constant
  # 2.0 pips bolted onto a mid series, so a SIM run would measure a fiction — and
  # every cost number in §7 rests on the spread being real.
  base_url: https://gateway.saxobank.com/openapi
  token_url: https://live.logonvalidation.net/token
  authorize_url: https://live.logonvalidation.net/authorize

  # Same +1 convention as crypto: the newest bar is still forming and is dropped, so
  # 321 requested is 320 closed.
  #
  # 1h asks for 1200, not 321 (owner correction C3, 2026-08-21). 321 bars is ~13 days,
  # which after weekends leaves ~10 samples in each hour-of-day spread bucket, and a
  # median over ten noisy samples is not a baseline — least of all in the tail hours
  # where it decides whether a signal is emitted. 1200 is ~50 days and ~35 samples per
  # bucket, which is what the spike actually measured, and it is still ONE request
  # sitting exactly at the ceiling rather than over it. Features still use the most
  # recent 321 of that tail, so this is a spread-profile change and not a feature one.
  timeframes:
    - { timeframe: 15m, candles: 321 }
    - { timeframe: 1h, candles: 1200 }
    - { timeframe: 4h, candles: 321 }
    - { timeframe: 1d, candles: 101 }
  feature_candles_1h: 321
  # Saxo's documented Count ceiling. Over-requesting CLAMPS SILENTLY to it, which is
  # why every read asserts the count it actually got (spike defect D-e).
  max_count: 1200
  spread_lookback_candles: 1200

  # There is no closed-candle flag. A bar stamped T on horizon H is closed iff
  # now >= T + H + grace, and without that rule a forming bar poisons RSI, ATR and the
  # whole EMA stack on the newest candle — plausibly, with no error. Measured publish
  # lag was 0-4s across four rolls, plus 5s of poll pessimism: 9s worst observed, and
  # 30s is ~3x that. Being generous costs nothing against a 60-minute bar.
  candle_grace_seconds: 30

  # No new signal when the current spread exceeds this multiple of the instrument's
  # GLOBAL median (spec defect #15, owner correction C2, 2026-08-21).
  #
  # Global, NOT per-hour-of-day. §5.3 said per-hour and that is self-defeating: at
  # 21:00 GBPUSD's hour-of-day median IS 12.0 pips, so a 12-pip spread at 21:00 is
  # "normal for that hour" and sails through — while costing 0.667R of an 18-pip stop.
  # Against the global median, rollover hours fail naturally, which is what §5.3 was
  # reaching for. The per-hour median is still what the COST model uses.
  #
  # 3.0 is a STARTING GUESS to be calibrated from DRY_RUN data, not a derived figure.
  # Sanity check: EURUSD's global median of 1.1 gives a 3.3-pip threshold, GBPUSD's
  # 1.8 gives 5.4 — and its 21:00 median of 12.0 fails that.
  spread_max_multiple: 3.0
  spread_min_samples: 30

  # The trading week, in UTC and all NOMINAL. The real boundary moves by an hour twice
  # a year because the US and EU change daylight saving on different dates, so these
  # are a sanity check against what the candles show, never the authority.
  week_open_hour_utc: 21
  week_close_hour_utc: 21
  # No signals in the first hours of the week. D-d leaves the Sunday open ambiguous
  # (19:00Z or 21:00Z depending how you ask) and Sunday-evening liquidity is thin
  # anyway, so nothing is lost by staying quiet through the ambiguity.
  week_open_quiet_hours: 3
  # No new signals after this hour on Friday: a ladder placed later cannot fill before
  # the weekend, and one that does fill carries gap risk through it.
  friday_signal_cutoff_hour_utc: 19
  # The hour on Friday at which every still-pending entry ladder EXPIRES (§5.4, §16.10).
  # Expired with a reason the owner sees, never paused: a rung that filled on the Sunday
  # open would fill against a gap nobody's stop was placed for. One hour before the close
  # rather than derived from it, because a derivation would have to survive the DST shift
  # §5.2 describes and an explicit hour does not. Config load REFUSES a value at or after
  # week_close_hour_utc — at or after it the ladder simply survives the weekend and the
  # rail silently stops existing.
  friday_ladder_expiry_hour_utc: 20

  # Swap is charged here and TRIPLED on Wednesday. The 19-22 window is half-open on
  # bar stamps, so it covers the bars stamped 19, 20 and 21 — wall-clock 19:00-22:00,
  # which is exactly the three bars the spike measured as elevated. v1's +/-15 minutes
  # was far too narrow. This clock window is the BACKSTOP; the spread trigger above is
  # the primary rail.
  rollover_hour_utc: 21
  rollover_window_start_hour_utc: 19
  rollover_window_end_hour_utc: 22

  # The economic calendar (§8). There is NO reachable Saxo calendar — the feature flag
  # says Calendar: true and all five probed paths 404 — so sentinel/fx/data/calendar.yaml
  # is the ONLY source. It ships claiming no coverage, so forex emits nothing until it
  # is populated: with one source, "I do not know" and "nothing is scheduled" are the
  # same silence, and only one of them is safe to trade through.
  blackout_before_minutes: 60
  blackout_after_minutes: 30
  calendar_warn_within_days: 14

  # The spread is MEASURED, not configured. Only what the chart cannot tell us is here.
  # Saxo's standard FX spot pricing is spread-only, so commission is a configured zero
  # for an account-specific fee — not a missing measurement standing in as one.
  commission_per_million_quote: 0
  # Swap in pips per night, per instrument per direction. Empty on purpose: swap rates
  # are account- and date-specific, published by the broker rather than derivable from
  # the chart, and a plausible-looking guess here would be a fabricated cost.
  swap_pips_per_night: {}
  # false = the gate charges max(0, rollover), so a swap CREDIT is shown but can never
  # be the reason a plan clears the threshold. Same rule as crypto's funding.
  credit_favourable_rollover: false

  # 30:1 is the ESMA retail cap and it is an ASSUMPTION, not a reading: the instrument
  # details response carries no MarginRates and no MarginTiers (spike defect D-f), so
  # v1's "read the venue's actual leverage figure" is not satisfiable. Every sized
  # position carries those words with the number so a surface cannot show one without
  # the other.
  max_leverage: 30
  max_margin_pct_of_equity: 20
  # One open forex position at a time for the first measurement window (§9). EURUSD,
  # GBPUSD and USDJPY all cross the dollar, so long EURUSD plus short USDJPY is one
  # large short-dollar bet wearing two hats and the existing rails would allow both.
  max_concurrent_positions: 1

  # ── setup quality (M10c, §16.5; spec defect #21) ───────────────────────────────
  #
  # §7 and §9 name the sizing rails and the correlation cap and say nothing about setup
  # QUALITY, so these had no home and the obvious move was to read crypto's `risk:` block.
  # One of those numbers is actively wrong here: risk.max_entry_distance_pct is 3.0, and
  # EURUSD moves about 0.5% in a DAY, so a 3% bound could essentially never fire. A rail
  # that cannot fire is worse than an absent one, because it reads on a checklist as a
  # rail. So forex gets its own and crypto's `risk:` block is untouched.
  #
  # Every number here is a STARTING GUESS to be calibrated from DRY_RUN, in the same
  # standing as spread_max_multiple above — not a derived figure.
  #
  # min_rr_tp1 is the exception and is deliberately the SAME 1.5 crypto gates on: §7.4
  # computes what gross RR a forex setup needs to clear a 1.5 net gate, and
  # journal/M10b_REPORT.md §6 measured 1.65-1.76 at the widest stop each pair can size at
  # €200. Two markets gated at the same NET level is what makes their statistics
  # comparable at all.
  min_rr_tp1: 1.5
  min_confidence: 60
  # 0.5, not crypto's 3.0. This is the number defect #21 is about.
  max_entry_distance_pct: 0.5
  # Carried over from crypto unchanged, because they are expressed in ATR — the
  # instrument's own volatility — which is what makes them transferable where a
  # percentage is not.
  stop_atr_min_multiple: 0.6
  stop_atr_max_multiple: 3.0
  signal_cooldown_hours: 4
  # Three, not crypto's five, because there are three instruments: a fourth forex signal
  # in a day means the same dollar view arriving twice, which is what §9's correlation
  # cap exists to prevent one level down.
  max_signals_per_day: 3

  # How many timeframes old the newest CLOSED candle may be while the market is OPEN.
  # Checked only when open — a weekend read is hours stale by construction and that is
  # not a fault. See spec defect #14: FOREX.md §5.1 expected crypto's staleness rule to
  # misfire over the weekend when in fact it compares fetched_at and would have called
  # a frozen weekend snapshot perfectly fresh.
  #
  # M10e, defect #31 — THIS NUMBER MEANS TWO DIFFERENT THINGS, and deliberately so.
  # For 15m/1h/4h it is multiples of the timeframe in WALL-CLOCK time: 30 minutes, 2
  # hours, 8 hours. For 1d it is multiples of a day in OBSERVED MARKET hours — hourly
  # bars the venue actually served — because wall clock cannot survive a weekend. On a
  # Monday the newest closed daily bar is Friday's, 79 hours old at the first cycle of
  # the day and 90 at the last, and this rail emptied forex for its entire first
  # trading day before anybody noticed the difference.
  #
  # 2 is "you may be one bar behind, no more" under both readings, and it is NOT the
  # knob to reach for if the daily rail starts firing again. Watch `margin_hours` on
  # the `forex.daily_freshness` log line first: a Monday evening clears by single
  # digits, and journal/M10e_REPORT.md §R1 says what to do when it stops.
  max_candle_age_multiplier: 2

  # WHICH HOURS FOREX IS SCANNED, half-open UTC. [7, 19) is twelve hourly cycles
  # covering London and the New York morning. Owner decision, 2026-08-21, for the
  # observation window; `[0, 24]` turns the window off.
  #
  # WHY IT ENDS AT 19 AND NOT AT 21 — the reason is evidence quality, not cost.
  #
  # journal/M10b_SPIKE.md §3 (defect D-g) measured elevated spreads from 19:00 through
  # 21:00 UTC: GBPUSD's hour-of-day median is 4.6 pips at 20:00 and 12.0 at 21:00,
  # against a global median of 1.8. §5.3 answered that with a spread-TRIGGERED rail —
  # and the rail provably does not reject those hours. `spread_gate` reaches its clock
  # backstop only when the spread series is UNUSABLE, and at a 1200-bar tail it never
  # is, so `ROLLOVER_WINDOW` is unreachable in production and the measured rail decides
  # alone. At 3.0x the global median the thresholds are 3.3 / 5.4 / 4.5 pips for
  # EURUSD / GBPUSD / USDJPY, and the 19:00 and 20:00 hour medians are 1.1-1.8 and
  # 1.5-4.6. Every one of them passes.
  #
  # So the 19:00 and 20:00 cycles bought the day's WORST evidence at full price, with
  # the rail written to stop exactly that letting them through — and the cost model
  # then charged them the hour-of-day median at row 9, so most of what they bought was
  # rejected on net RR anyway. Recorded as FOREX.md defect #30 and NOT fixed here: the
  # fix is a new threshold, which is a new uncalibrated guess, and this window sidesteps
  # it. 19 invents nothing — it is already `friday_signal_cutoff_hour_utc`, chosen for
  # the same reason, so the daily window now ends where the Friday one does.
  #
  # It is also a spend rail, and that is the secondary benefit rather than the reason.
  # Forex has no screener and no usable re-analysis cooldown, so every cycle is three
  # claude-fable-5 calls unconditionally — $0.734 measured. Twelve cycles is ~$8.81 on a
  # trading day against a real ceiling of $12; twenty-four would be ~$17.6. Outside
  # these hours the cycle returns before the first fetch, so they cost ZERO rather than
  # cheap. Nothing here costs information the prompt does not already discount:
  # fable_forex_v1.md tells the model in as many words that a level formed in a thin
  # session is weaker evidence than the same level in the London-NY overlap.
  scan_hours_utc: [7, 19]

  # The access token lives ~20 minutes, but the cadence is really about the REFRESH
  # token: it lives ~1 hour and rotates on every use, and each refresh resets that
  # hour. That hour is the whole margin between a restart that survives unattended and
  # one that needs a browser login.
  token_refresh_interval_seconds: 300
  token_expiry_margin_seconds: 120

# ─────────────────────────────────────────────────────────────────────────────
# M11p — the 🇮🇷 فارسی button on signal cards and /pulse SYMBOL verdicts.
#
# A convenience surface: a cheaper model rewriting the card the analyst already
# produced, into short spoken Persian. It never sees market data — only the rendered
# card, minus the per-user sizing — so it cannot form a second opinion, and every
# number it prints is checked against the card before anything is sent.
#
# WHY IT HAS ITS OWN RAILS. Presses are user-initiated, so their volume is a thumb
# rather than a market. The cost is recorded in `llm_calls` like every other call,
# which is what puts it on /status and the owner's /pulse spend line with no new
# surface — and it is also what would let it draw from `llm_daily_budget_global_usd`
# unchecked. `markets.crypto.llm_reserved_floor_usd` does NOT cover that: the floor
# holds crypto's unspent budget against OTHER MARKETS, and it is forex that is exposed
# here. Forex's real ceiling is 20 - 8 = $12 against a measured need of $8.81/day, so
# it has about $3.19 of slack and nothing else defending it.
#
# THE NUMBERS ARE MEASURED, NOT ESTIMATED (journal/M10d_REPORT.md §8's rule). One real
# call on tests/fixtures/golden_cycle/card_shared.txt, 2026-08-22, claude-sonnet-4-6,
# on a COLD cache — the pessimistic case, and the one an isolated press pays:
#
#   input 594 · cache write 1,031 · output 436 · 12.6 s · 611 characters
#   PER-PRESS COST  $0.012188          (warm, inside the 5-minute window: $0.007071)
#
#   two users x 20 generations = $0.4875, under the $0.60 ceiling
#   $0.60 is 4.8% of an ordinary $12.42 day and 19% of forex's $3.19 of slack
#
# The system prompt is 1,031 tokens and Anthropic does not cache a block below 1,024,
# so this path only started caching at all when M11p's verdict rule was added to the
# prompt. A press pays the write; a press within five minutes of another reads it back.
#
# `daily_generations_per_user` counts GENERATIONS, not presses: a second press on the
# same card returns the stored text and costs nothing, and rationing a free action
# would be a rail that only annoys. Re-measure with
# `python -m sentinel.tools.persian_summary_cost --call` before moving either number.
persian_summary:
  enabled: true
  model: claude-sonnet-4-6
  prompt_version: persian_summary_v1
  # 700 against a measured 436, and 900 against a measured 611. Telegram allows 4096;
  # the ceiling that matters is the thirty-second read, not the limit. An overrun is
  # logged and still sent — length is a style failure. Only the numbers check fails
  # closed, and keeping the two kinds of failure visibly different is what stops the
  # rail being softened to accommodate the taste.
  max_output_tokens: 700
  max_output_chars: 900
  # 12.6 s measured. 60 leaves room for a long card without leaving a reader watching
  # a spinner for the 150 s the analyst is allowed.
  timeout_seconds: 60
  # Quoted, so YAML hands over the STRING "0.50" rather than the float 0.5 — the
  # same trap the crypto budget comments describe at the top of this file. It is
  # only ever compared and logged here, never rendered on a card, but a rail whose
  # log line reads "of $0.5" is one nobody double-checks.
  daily_usd_cap: "0.60"
  daily_generations_per_user: 20
  double_tap_seconds: 5
